# Copy of https://docs.github.com/en/packages/managing-github-packages-using-github-actions-workflows/publishing-and-installing-a-package-with-github-actions

name: Create and publish a Docker image

on:
    push:
        branches:
            - "main"

jobs:
    build-and-push-image:
        runs-on: ubuntu-latest
        permissions:
            contents: read
            packages: write
            attestations: write
            id-token: write
        steps:
            - name: Checkout repository
              uses: actions/checkout@v6
            - name: Log in to the Container registry
              uses: docker/login-action@v4
              with:
                  registry: ghcr.io
                  username: jkmnt
                  password: ${{ secrets.GITHUB_TOKEN }}
            - name: Build and push Docker image
              id: push
              uses: docker/build-push-action@v7
              with:
                  context: .
                  push: true
                  tags: ghcr.io/jkmnt/pyinstaller-wine:latest
